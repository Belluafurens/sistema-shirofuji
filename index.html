<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><title>Shirofuji OS</title>
    <style>
        :root { --bg: #008080; --gray: #c0c0c0; --dark: #808080; --blue: #000080; }
        body { background: var(--bg); font-family: Tahoma, Arial, sans-serif; margin: 0; overflow: hidden; user-select: none; }
        #desktop { width: 100vw; height: 100vh; position: relative; padding: 20px; box-sizing: border-box; }
        .icon { width: 80px; text-align: center; color: white; cursor: pointer; position: absolute; }
        .icon .box { width: 32px; height: 32px; background: #000; border: 2px outset #fff; margin: 0 auto 5px; color: #00ff00; font-size: 10px; line-height: 32px; font-weight: bold; }
        .icon span { font-size: 11px; background: rgba(0,0,0,0.4); padding: 2px 4px; display: block; }
        .window { width: 600px; background: var(--gray); border: 2px solid; border-color: #fff var(--dark) var(--dark) #fff; position: absolute; top: 80px; left: 100px; display: flex; flex-direction: column; z-index: 10; }
        .title-bar { background: var(--blue); color: white; padding: 4px 6px; font-weight: bold; display: flex; justify-content: space-between; cursor: move; }
        .title-btn { background: var(--gray); border: 1px solid; border-color: #fff var(--dark) var(--dark) #fff; width: 16px; height: 14px; font-size: 10px; text-align: center; line-height: 12px; cursor: pointer; color: black; }
        .content { background: black; color: #00ff00; font-family: 'Courier New', monospace; padding: 10px; height: 360px; overflow-y: auto; border: 2px inset #fff; margin: 4px; box-sizing: border-box; }
        .input-line { display: flex; margin-top: 5px; }
        .prompt { color: #00ff00; margin-right: 5px; white-space: nowrap; }
        .cmd-input { background: transparent; border: none; color: #00ff00; font-family: 'Courier New', monospace; font-size: 14px; width: 100%; outline: none; }
    </style>
</head>
<body>
<div id="desktop">
    <div class="icon" onclick="abrir()"><div class="box">>_</div><span>Painel.exe</span></div>
    <div class="window" id="win">
        <div class="title-bar" id="handle"><span>💻 C:\SHIROFUJI_OS\MONITOR.EXE</span><div class="title-btn" onclick="fechar()">X</div></div>
        <div class="content" id="log">
            <div>[SHIROFUJI MONITOR OS - V1.4.7]</div>
            <div>DIRETRIZ DE PROTEÇÃO GEOPOLÍTICA DO GRÊMIO SUPREMO</div>
            <div>--------------------------------------------------------</div>
            <div style="color:#ffa000;">DIGITE SEU NOME DE USUÁRIO PARA INICIAR A SESSÃO RÚNICA:</div><br>
            <div class="input-line"><span class="prompt" id="p-text">LOGIN></span><input type="text" class="cmd-input" id="in" autofocus onkeydown="cmd(event)"></div>
        </div>
    </div>
</div>
<script>
    const USER = "Belluafurens"; 
    const REPO = "sistema-shirofuji";
    // URL CORRIGIDA: Aponta diretamente para o servidor de arquivos brutos do GitHub
    const BASE_URL = "https://githubusercontent.com" + USER + "/" + REPO + "/main/";
    
    let dir = "LOGIN", cap = null, DB_ALUNOS = {}, mortos =, nickUsuario = "user";
    const PASTAS = { "C:\\": {p: ["BIN", "USER", "LOGS"], f: ["LEIA_ME.TXT"]}, "C:\\BIN": {p:, f: ["MONITOR.EXE"]}, "C:\\USER": {p:, f: ["NOTAS.LOG"]}, "C:\\LOGS": {p:, f: ["BAIXAS.DAT"]} };
    const TXT = { "LEIA_ME.TXT": "BEM-VINDO AO CONSOLE RÚNICO.\nUse 'LISTAR' para ver herois ativos ou 'FICHA [Nº]' para investigar.", "NOTAS.LOG": "[REGISTRO OCULTO - LIVIA MATSUI]\nHá um Árbitro na floresta monitorando as regras do Pacto das Sombras. Cuidado." };

    function print(t, c = "#00ff00") { const log = document.getElementById("log"), div = document.createElement("div"); div.style.color = c; div.innerHTML = t.replace(/\n/g, "<br>"); log.insertBefore(div, log.lastElementChild); log.scrollTop = log.scrollHeight; }
    function abrir() { document.getElementById("win").style.display = "flex"; }
    function fechar() { document.getElementById("win").style.display = "none"; }

    async function carregarCap(numCap) {
        try {
            print(" Baixando dados unificados do colégio...", "#ffa000");
            const rA = await fetch(BASE_URL + "alunos.txt"); if(!rA.ok) throw new Error();
            const tA = await rA.text(); DB_ALUNOS = {};
            tA.split("\n").forEach(l => {
                if(!l.trim() || !l.includes("|")) return; const p = l.split("|"); const id = parseInt(p.replace("Nº","").trim());
                if(!isNaN(id)) DB_ALUNOS[id] = { nome: p.trim(), classe: p.trim(), turma: p.trim() };
            });
            print(" Sincronizando óbitos do Capítulo " + numCap + "...", "#ffa000");
            const rO = await fetch(BASE_URL + "obitos_cap" + numCap + ".txt");
            if (rO.ok) { const tO = await rO.text(); mortos = tO.split("\n").map(x => parseInt(x.trim())).filter(x => !isNaN(x)); } else { mortos =; }
            TXT["BAIXAS.DAT"] = mortos.length === 0 ? "Nenhum óbito registrado." : "IDs afetados:\n" + mortos.join("\n");
            cap = numCap; dir = "C:\\"; document.getElementById("p-text").innerText = `${nickUsuario}@SHIROFUJI_OS:C:\\>`;
            print("\n[+] CONEXÃO OK. Sincronizado no Capítulo " + cap + ".", "#00ff00");
        } catch (e) { print("[-] ERRO CRÍTICO: Falha ao baixar arquivos do GitHub.", "#ff0000"); }
    }

    async function cmd(e) {
        if (e.key !== 'Enter') return;
        const input = document.getElementById("in"), v = input.value.trim(); input.value = ""; if (!v) return;
        print(`${dir}> ${v}`, "#fff");
        if (dir === "LOGIN") {
            let n = v.trim(); if (n.toUpperCase() === "CRISANT" || n.toUpperCase() === "CRISANT HAWTHORNE") { nickUsuario = "Arbitro_Hawthorne"; print("\n[!!!] ALERTA DE SISTEMA: ANOMALIA JURÍDICA DETECTADA\nO Pacto das Sombras reconhece o portador do Manto Azul-Petróleo.\n", "#ffff00"); } 
            else { nickUsuario = n.replace(/[^a-zA-Z0-9]/g, "") || "user"; }
            dir = "RÚNE_KEY"; document.getElementById("p-text").innerText = "INIT_CAP>";
            print(`Usuário definido como: ${nickUsuario}`, "#00ff00"); print("Insira o comando INIT_[Nº_DO_CAP] para sincronizar.", "#ffa000"); return;
        }
        if (v.toUpperCase() === "CLS") { const log = document.getElementById("log"); while (log.childNodes.length > 4) { log.removeChild(log.firstChild); } return; }
        if (!cap) {
            if (v.toUpperCase().startsWith("INIT_")) { 
                let partesV = v.split("_"); let n = parseInt(partesV);
                if (!isNaN(n) && n >= 1) await carregarCap(n); else print("[-] ERRO: Use INIT_[Nº].", "#ff0000"); 
            } else { print("[-] ACESSO NEGADO. Forneça o capítulo rúnico para continuar.", "#ff0000"); } return;
        }
        const p = v.split(" "), acao = p.toUpperCase(), arg = p ? p.toUpperCase() : "";
        if (acao === "HELP") { print("\nDIR          - Lista arquivos\nCD [pasta]   - Muda pasta\nTYPE [arq]   - Lê texto\nBAIXAS       - Lista IDs mortos\nLISTAR       - Lista heróis vivos\nFICHA [Nº]   - Prontuário\nCLS          - Limpa tela\nRESET        - Bloqueia sistema", "#ffa000"); }
        else if (acao === "DIR") { if (PASTAS[dir]) { PASTAS[dir].p.forEach(x => print(`<DIR>    ${x}`, "#fff000")); PASTAS[dir].f.forEach(x => print(`         ${x}`, "#00aaff")); } }
        else if (acao === "CD") { if (arg === "..") { if (dir !== "C:\\") { dir = "C:\\"; document.getElementById("p-text").innerText = `${nickUsuario}@SHIROFUJI_OS:C:\\>`; } } else { let n = dir === "C:\\" ? `C:\\${arg}` : `${dir}\\${arg}`; if (PASTAS[n]) { dir = n; document.getElementById("p-text").innerText = `${nickUsuario}@SHIROFUJI_OS:${dir}>`; } else { print("[-] Pasta não existe.", "#ff0000"); } } }
        else if (acao === "TYPE") { if (TXT[arg]) print(`\nExibindo: ${arg}\n-------------------\n${TXT[arg]}\n`, "#00aaff"); else print("[-] Arquivo inválido.", "#ff0000"); }
        else if (acao === "LISTAR") { for (let id in DB_ALUNOS) { if (!mortos.includes(parseInt(id))) print(`Nº ${String(id).padStart(3,'0')} | ${DB_ALUNOS[id].nome} [${DB_ALUNOS[id].turma}]`); } }
        else if (acao === "BAIXAS") { print("\n!!! ÓBITOS NO CAPÍTULO " + cap + " !!!", "#ff0000"); if (mortos.length === 0) print("Nenhum óbito registrado.", "#00ff00"); else mortos.forEach(id => { if(DB_ALUNOS[id]) print(`[-] Nº ${String(id).padStart(3,'0')} | ${DB_ALUNOS[id].nome} (${DB_ALUNOS[id].turma})`, "#ff0000"); }); }
        else if (acao === "FICHA") { let id = parseInt(p); if (DB_ALUNOS[id]) { print(`\nNome: ${DB_ALUNOS[id].nome} | Turma: ${DB_ALUNOS[id].turma} | Classe: ${DB_ALUNOS[id].classe}`); if (mortos.includes(id)) print("STATUS: [ SINAL VITAL INTERROMPIDO ]", "#ff0000"); else print("STATUS: [ OPERANTE ]", "#00ff00"); } else print("[-] ID inválido.", "#ff0000"); }
        else if (acao === "RESET") { cap = null; mortos =; DB_ALUNOS = {}; dir = "LOGIN"; document.getElementById("p-text").innerText = "LOGIN>"; print("\n[!] Sessão encerrada.", "#ffa000"); }
        else print("[-] Comando inválido.", "#ff0000");
    }
    const win = document.getElementById("win"), handle = document.getElementById("handle"); let drag = false, x, y; handle.addEventListener("mousedown", (e) => { drag = true; x = e.clientX - win.offsetLeft; y = e.clientY - win.offsetTop; }); document.addEventListener("mousemove", (e) => { if (drag) { win.style.left = `${e.clientX - x}px`; win.style.top = `${e.clientY - y}px`; } }); document.addEventListener("mouseup", () => drag = false);
</script>
</body>
</html>
